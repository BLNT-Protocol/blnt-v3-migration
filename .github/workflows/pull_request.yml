name: pull_request

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  complete:
    if: always()
    needs: [fmt-v2, build-and-test-v2, check-v3]
    runs-on: ubuntu-latest
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1

  fmt-v2:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        submodules: recursive
    - run: rustup toolchain install 1.81 --profile minimal --component rustfmt
    - run: cargo +1.81 fmt --manifest-path blend-contracts-v2/Cargo.toml --all --check

  build-and-test-v2:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        submodules: recursive
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          blend-contracts-v2/target
        key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('blend-contracts-v2/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('blend-contracts-v2/Cargo.lock') }}-
          cargo-${{ runner.os }}-${{ github.job }}-
    - run: rustup toolchain install 1.81 --profile minimal --target wasm32-unknown-unknown
    - uses: stellar/stellar-cli@f4fd838380408dcad3e39f704e8d56d6408c63e2 # v22.6.0
      with:
        version: 22.6.0
    - run: make test

  check-v3:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        submodules: recursive
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          blnt-contracts-v3/target
          migration-harness/target
        key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('blnt-contracts-v3/Cargo.lock', 'migration-harness/Cargo.lock', 'deployed-artifacts/mainnet/manifest.json') }}-${{ github.sha }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('blnt-contracts-v3/Cargo.lock', 'migration-harness/Cargo.lock', 'deployed-artifacts/mainnet/manifest.json') }}-
          cargo-${{ runner.os }}-${{ github.job }}-
    - uses: stellar/stellar-cli@5a7c5fe76530bf4248477ac812fc757146b98cc4 # v27.0.0
      with:
        version: 27.0.0
    - run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt --target wasm32v1-none
    - run: make check-v3
