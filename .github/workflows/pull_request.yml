name: pull_request

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  complete:
    if: always()
    needs: [fmt-v2, build-and-test-v2, check-v3]
    runs-on: ubuntu-latest
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1

  fmt-v2:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        submodules: recursive
    - run: rustup toolchain install 1.81 --profile minimal --component rustfmt
    - run: cargo +1.81 fmt --manifest-path legacy/blend-contracts-v2/Cargo.toml --all --check

  build-and-test-v2:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        submodules: recursive
    - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          legacy/blend-contracts-v2/target
        key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('legacy/blend-contracts-v2/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('legacy/blend-contracts-v2/Cargo.lock') }}-
          cargo-${{ runner.os }}-${{ github.job }}-
    - run: rustup toolchain install 1.81 --profile minimal --target wasm32-unknown-unknown
    - uses: stellar/stellar-cli@f4fd838380408dcad3e39f704e8d56d6408c63e2 # v22.6.0
      with:
        version: 22.6.0
    - run: make test

  check-v3:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        submodules: recursive
    - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          blend-contracts-v3/target
          migration/target
        key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('blend-contracts-v3/Cargo.lock', 'migration/Cargo.lock', 'legacy/artifacts/manifest.json') }}-${{ github.sha }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('blend-contracts-v3/Cargo.lock', 'migration/Cargo.lock', 'legacy/artifacts/manifest.json') }}-
          cargo-${{ runner.os }}-${{ github.job }}-
    - uses: stellar/stellar-cli@5a7c5fe76530bf4248477ac812fc757146b98cc4 # v27.0.0
    - run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt --target wasm32v1-none
    - run: make check-v3
