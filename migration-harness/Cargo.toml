[workspace]
resolver = "2"
members = [
    "compat-probe",
    "migration-tests",
    "test-sep40-oracle",
    "test-valuation-adapter",
]

[workspace.package]
edition = "2021"
rust-version = "1.91.1"
license = "AGPL-3.0"
publish = false

[workspace.dependencies.soroban-sdk]
version = "=27.0.3"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
